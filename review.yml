  endpointsModeledSchemas: |
    Endpoint paths, HTTP methods, base URLs, the OAuth2 client-credentials flow,
    and the token endpoint are grounded in Skydropx's public API documentation
    (docs.skydropx.com and pro.skydropx.com/es-MX/api-docs). Request and response
    SCHEMAS in openapi/skydropx-openapi.yml are MODELED from documented fields
    (zip_from/zip_to/parcel on quotations; quotation_id/rate_id/address_from/
    address_to/consignment_note codes on shipments) plus common shipping-API
    conventions, and should be reconciled against the live reference before
    production use. The classic Skydropx API (api.skydropx.com/v1) and Radar API
    (radar-api.skydropx.com/v1) are acknowledged but not modeled.
sources:
  - url: https://docs.skydropx.com/
    type: Documentation
    note: Classic Skydropx API reference. Base https://api.skydropx.com/v1; Authorization Token header; quotations, shipments, labels, cancel_label_requests, carriers, consignment_notes. No WebSocket mentioned.
  - url: https://pro.skydropx.com/es-MX/api-docs
    type: APIReference
    note: Skydropx Pro API reference. Base https://pro.skydropx.com/api/v1; OAuth2 client-credentials at POST /oauth/token; 2h token; ~2 req/sec. All REST.
  - url: https://help.skydropx.com/articulos-cda/conectar-la-api-skydropx
    type: Documentation
    note: Help-center guide to connecting the Skydropx API and obtaining credentials.
  - url: https://www.skydropx.com/plataforma/api/
    type: Documentation
    note: Marketing/overview page for the Skydropx API platform.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Skydropx's public API is
    request/response REST (Skydropx Pro over OAuth2 Bearer, classic Skydropx
    over an API-key Token header, plus Radar tracking). Asynchronous status
    updates are delivered by Skydropx POSTing to a client webhook endpoint, not
    over a server-push transport on Skydropx's own API, so no AsyncAPI document
    was created.
