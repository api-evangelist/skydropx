aid: skydropx
name: Skydropx
review:
  question: Does Skydropx expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Skydropx's public API surface is
    request/response REST over HTTPS. Asynchronous shipment status updates are
    delivered by Skydropx POSTing to a client-configured webhook endpoint
    (server-to-endpoint HTTP), not over a WebSocket or SSE stream on Skydropx's
    own API. There is no server-push transport on Skydropx's own API to model.
findings:
  summary: |
    Skydropx does not publish a documented public WebSocket API. Skydropx is a
    Mexican multi-carrier shipping and logistics platform. Its modern Skydropx
    Pro API (base https://pro.skydropx.com/api/v1, sandbox
    https://sb-pro.skydropx.com/api/v1) is pure request/response REST over
    HTTPS, authenticated with an OAuth2 client-credentials Bearer token obtained
    from POST /oauth/token. A separate classic Skydropx API
    (https://api.skydropx.com/v1) is authenticated with an
    `Authorization: Token token=API_KEY` header, and a Radar tracking API
    (https://radar-api.skydropx.com/v1) also exists. Real-time-style shipment
    status changes (created, picked up, in transit, delivered, exception) are
    pushed to client webhook endpoints via HTTP POST, not over a WebSocket. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint
    is documented anywhere in Skydropx's API references as of the review date.
  saas: |
    Skydropx is a proprietary SaaS platform (not open source). The platform is
    free to use; billing is prepaid pay-per-label from a wallet balance managed
    via the Finance API (GET /finance/credits). Accounts and API credentials are
    provisioned through the Skydropx Pro dashboard; classic API keys are issued
    on request via support.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://pro.skydropx.com/api/v1
      documented: true
      note: Skydropx Pro API. OAuth2 client-credentials Bearer auth. Sandbox at https://sb-pro.skydropx.com/api/v1.
    - protocol: REST
      scheme: https
      baseURL: https://api.skydropx.com/v1
      documented: true
      note: Classic Skydropx API, authenticated with an Authorization Token header (API key). Not modeled in the OpenAPI.
    - protocol: REST
      scheme: https
      baseURL: https://radar-api.skydropx.com/v1
      documented: true
      note: Radar tracking API (shipments and tracking). Not modeled in the OpenAPI.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Skydropx POSTs shipment status-change notifications to a client-configured HTTP endpoint. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in any Skydropx API reference as of the review date.
