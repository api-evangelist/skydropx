description: >-
  FinOps view of Skydropx spend. Skydropx is a prepaid, pay-per-label shipping
  platform: the platform and API are free, and cost is driven by the labels you
  generate plus per-shipment surcharges (for example dimensional/weight
  adjustments), debited from a prepaid wallet balance. There is no per-API-call
  fee. The dominant cost driver is label volume and the carrier/service mix
  chosen at quotation time, so cost optimization happens by comparing carrier
  rates before purchasing labels and by minimizing corrective surcharges through
  accurate parcel data.
notes: >-
  Per-label rates are dynamic and not reconciled here. The prepaid wallet
  balance is readable via GET /finance/credits and applied surcharges via
  GET /finance/extra-charges, which together support spend reconciliation.
  Verify current rates and surcharge policy on Skydropx's pricing pages.
