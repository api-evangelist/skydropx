meters:
- name: shipping_labels
  description: Shipping labels generated, billed per label at dynamic carrier rates.
  unit: labels
  aggregation: sum
  dimensions:
  - account
  - carrier
  - service_level
- name: extra_charges
  description: Per-shipment surcharges and adjustments (for example dimensional/weight corrections).
  unit: charges
  aggregation: sum
  dimensions:
  - account
  - shipment
- name: wallet_balance
  description: Prepaid wallet credit balance drawn down as labels and surcharges are billed.
  unit: currency
  aggregation: last
  dimensions:
  - account
principles:
- name: Visibility
  description: Track label spend per carrier and service level, and reconcile extra charges via GET /finance/extra-charges against the wallet balance from GET /finance/credits.
- name: Allocation
  description: Tag shipments/orders with references so label cost maps to stores, channels, or cost centers.
- name: Optimization
  description: Compare multi-carrier quotations before purchasing labels and supply accurate parcel weight/dimensions to avoid corrective surcharges.
- name: Accountability
  description: Monitor the prepaid wallet balance and set top-up thresholds; review label volume and surcharge trends against budget.
