name: Skydropx
kind: company
description: Skydropx is a Mexican multi-carrier shipping and logistics platform that
  lets e-commerce sellers and businesses compare rates, generate labels, schedule
  pickups, and track parcels across national and international carriers from a single
  API. Its modern Skydropx Pro API (base https://pro.skydropx.com/api/v1) is a REST
  interface secured with OAuth2 client-credentials Bearer tokens and covers
  quotations, shipments, labels/orders, pickups, address templates, tracking, and
  account credit balances. A separate classic Skydropx API (https://api.skydropx.com/v1,
  authenticated with an API key Token header) and a Radar tracking API also exist.
  Billing is prepaid - the platform is free to use and you pay per label from a
  wallet balance.
